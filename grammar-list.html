<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #0055a5;
      --secondary: #ef4135;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 30px;
    }

    .level-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
      padding: 20px;
      border-top: 5px solid var(--primary);
    }

    .level-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .topic-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .topic-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    .topic-item:last-child {
      border-bottom: none;
    }

    .topic-item:hover {
      background-color: #f1f5f9;
    }

    .topic-text {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .fr-text {
      font-weight: 600;
      color: #0f172a;
      direction: ltr;
      display: inline-block;
    }

    .ar-text {
      color: #64748b;
      font-size: 0.95rem;
    }

    .copy-btn {
      background-color: #e0f2fe;
      color: #0369a1;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    .copy-btn.copied {
      background-color: #22c55e;
      color: white;
    }
  </style>
</head>

const container = document.getElementById('grammar-container');

data.forEach((section) => {
  const card = document.createElement('div');
  card.className = 'level-card';

  const title = document.createElement('div');
  title.className = 'level-title';
  title.innerText = section.level;
  card.appendChild(title);

  const list = document.createElement('ul');
  list.className = 'topic-list';

  section.topics.forEach((topic, index) => {
    const li = document.createElement('li');
    li.className = 'topic-item';

    const textDiv = document.createElement('div');
    textDiv.className = 'topic-text';
    textDiv.innerHTML = `
      <span style="color:#94a3b8; font-size:0.9rem;">${index + 1}.</span>
      <span class="fr-text">${topic.fr}</span>
      <span class="ar-text">— ${topic.ar}</span>
    `;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.innerText = 'نسخ الفرنسي';

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(topic.fr).then(() => {
        copyBtn.innerText = 'تم النسخ! ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.innerText = 'نسخ الفرنسي';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    };

    li.appendChild(textDiv);
    li.appendChild(copyBtn);
    list.appendChild(li);
  });

  card.appendChild(list);
  container.appendChild(card);
});
