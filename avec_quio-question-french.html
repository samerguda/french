        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('gridControls').style.display = mode === 'grid' ? 'flex' : 'none';
        document.getElementById('grid').style.display = mode === 'grid' ? 'grid' : 'none';
        document.getElementById('flashcardView').style.display = mode === 'flashcard' ? 'flex' : 'none';
        document.getElementById('quizView').style.display = mode === 'quiz' ? 'block' : 'none';

        if(mode === 'flashcard') updateFlashcard();
        if(mode === 'quiz') nextQuiz();
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = cat;
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const filtered = questions.filter(q => {
            const matchesCat = currentCat === 'all' || q.cat === currentCat;
            const matchesSearch = q.fr.toLowerCase().includes(searchTerm.toLowerCase()) || q.ar.includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        filtered.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="num">#${q.id}</span>
                    <button class="audio-btn" onclick="speak('${q.fr.replace(/'/g, "\\'")}')">🔊</button>
                </div>
                <div class="french">${q.fr}</div>
                <div class="arabic">${q.ar}</div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderGrid();
    });

    // Flashcard Logic
    function updateFlashcard() {
        const cardElem = document.getElementById('card');
        cardElem.classList.remove('flipped');
        const q = questions[currentFlashIndex];
        document.getElementById('flashFr').innerText = q.fr;
        document.getElementById('flashAr').innerText = q.ar;
        document.getElementById('cardCounter').innerText = `${currentFlashIndex + 1} / ${questions.length}`;
    }

    function nextCard() {
        currentFlashIndex = (currentFlashIndex + 1) % questions.length;
        updateFlashcard();
    }

    function prevCard() {
        currentFlashIndex = (currentFlashIndex - 1 + questions.length) % questions.length;
        updateFlashcard();
    }

    // Quiz Logic
    function nextQuiz() {
        const randomIndex = Math.floor(Math.random() * questions.length);
        currentQuizItem = questions[randomIndex];

        document.getElementById('quizFr').innerText = currentQuizItem.fr;

        // Distractors
        let options = [currentQuizItem.ar];
        while(options.length < 3) {
            let opt = questions[Math.floor(Math.random() * questions.length)].ar;
            if(!options.includes(opt)) options.push(opt);
        }
        options.sort(() => Math.random() - 0.5);

        const optionsElem = document.getElementById('quizOptions');
        optionsElem.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === currentQuizItem.ar) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('wrong');
                }
            };
            optionsElem.appendChild(btn);
        });
    }

    renderGrid();
</script>
</body>
</html>
