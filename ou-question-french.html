<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 سؤال بالفرنسية باستخدام Où ?</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .grammar-card {
            background: #e0f2fe;
            border-right: 4px solid var(--primary);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .grammar-card h3 {
            color: var(--primary-hover);
            margin-bottom: 8px;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #f1f5f9;
            color: var(--text-sub);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .num {
            background: #bae6fd;
            color: var(--primary-hover);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .french {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            direction: ltr;
            text-align: left;
            margin-bottom: 6px;
        }

        .arabic {
            color: var(--text-sub);
            font-size: 1rem;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇫🇷 100 سؤال باستخدام Où ?</h1>
        <p>دليلك التفاعلي الشامل للسؤال عن الأماكن والوجهات بالفرنسية</p>
    </header>

    <div class="grammar-card">
        <h3>💡 قواعد سريعة:</h3>
        <p>• <strong>Où est... ?</strong> تُستخدم للمفرد (مثال: <em>Où est la gare ?</em>)</p>
        <p>• <strong>Où sont... ?</strong> تُستخدم للجمع (مثال: <em>Où sont les clés ?</em>)</p>
        <p>• <strong>D'où viens-tu ?</strong> تعني: من أين أتيت؟ | <strong>Par où... ?</strong> تعني: عبر أين / من أين نمر؟</p>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن سؤال بالفرنسية أو العربية...">
        </div>
        <div class="tabs" id="categoryTabs">
            <button class="tab-btn active" data-cat="all">الكل (100)</button>
            <button class="tab-btn" data-cat="home">المكان والسكن</button>
            <button class="tab-btn" data-cat="work">العمل والدراسة</button>
            <button class="tab-btn" data-cat="movement">الحركة والاتجاهات</button>
            <button class="tab-btn" data-cat="daily">التسوق والأنشطة</button>
            <button class="tab-btn" data-cat="misc">أسئلة متنوعة</button>
        </div>
    </div>

    <div class="grid" id="grid"></div>
</div>

        {id: 42, cat: 'movement', fr: "Où allez-vous ?", ar: "إلى أين تذهبون؟"},

        {id: 57, cat: 'movement', fr: "Où mène cette route ?", ar: "إلى أين يؤدي هذا الطريق؟"},
        {id: 58, cat: 'movement', fr: "Où faut-il tourner ?", ar: "أين يجب أن ننعطف؟"},
        {id: 59, cat: 'movement', fr: "Où puis-je garer ma voiture ?", ar: "أين يمكنني ركن سيارتي؟"},
        {id: 60, cat: 'movement', fr: "Où se termine cette rue ?", ar: "أين ينتهي هذا الشارع؟"},

        // 61-80: الحياة اليومية والتسوق
        {id: 61, cat: 'daily', fr: "Où achètes-tu tes vêtements ?", ar: "أين تشتري ملابسك؟"},
        {id: 62, cat: 'daily', fr: "Où fais-tu tes courses ?", ar: "أين تتسوق؟"},
        {id: 63, cat: 'daily', fr: "Où as-tu acheté ce téléphone ?", ar: "أين اشتريت هذا الهاتف؟"},
        {id: 64, cat: 'daily', fr: "Où puis-je acheter du pain ?", ar: "أين يمكنني شراء الخبز؟"},
        {id: 65, cat: 'daily', fr: "Où peut-on manger ici ?", ar: "أين يمكننا تناول الطعام هنا؟"},
        {id: 66, cat: 'daily', fr: "Où veux-tu déjeuner ?", ar: "أين تريد تناول الغداء؟"},
        {id: 67, cat: 'daily', fr: "Où allons-nous dîner ?", ar: "أين سنتناول العشاء؟"},
        {id: 68, cat: 'daily', fr: "Où est le restaurant le plus proche ?", ar: "أين أقرب مطعم؟"},
        {id: 69, cat: 'daily', fr: "Où puis-je boire un café ?", ar: "أين يمكنني شرب القهوة؟"},
        {id: 70, cat: 'daily', fr: "Où est le menu ?", ar: "أين قائمة الطعام؟"},
        {id: 71, cat: 'daily', fr: "Où se trouve le marché ?", ar: "أين يقع السوق؟"},
        {id: 72, cat: 'daily', fr: "Où puis-je retirer de l’argent ?", ar: "أين يمكنني سحب المال؟"},

        {id: 75, cat: 'daily', fr: "Où puis-je essayer ces chaussures ?", ar: "أين يمكنني تجربة هذه الأحذية؟"},

        // 81-100: أسئلة متنوعة مهمة
        {id: 81, cat: 'misc', fr: "Où es-tu ?", ar: "أين أنت؟"},
        {id: 82, cat: 'misc', fr: "Où êtes-vous en ce moment ?", ar: "أين أنتم الآن؟"},
        {id: 83, cat: 'misc', fr: "Où étais-tu hier ?", ar: "أين كنت أمس؟"},
        {id: 84, cat: 'misc', fr: "Où étais-tu né ?", ar: "أين وُلدت؟ (للمذكر)"},

        {id: 87, cat: 'misc', fr: "Où as-tu passé tes vacances ?", ar: "أين قضيت إجازتك؟"},
        {id: 88, cat: 'misc', fr: "Où étais-tu pendant le week-end ?", ar: "أين كنت خلال عطلة نهاية الأسبوع؟"},

        {id: 92, cat: 'misc', fr: "Où puis-je consulter un médecin ?", ar: "أين يمكنني زيارة طبيب؟"},
        {id: 93, cat: 'misc', fr: "Où se trouve le commissariat de police ?", ar: "أين يقع مركز الشرطة؟"},
        {id: 94, cat: 'misc', fr: "Où puis-je demander des informations ?", ar: "أين يمكنني طلب المعلومات؟"},
        {id: 95, cat: 'misc', fr: "Où dois-je signer ?", ar: "أين يجب أن أوقّع؟"},
        {id: 96, cat: 'misc', fr: "Où puis-je obtenir ce document ?", ar: "أين يمكنني الحصول على هذه الوثيقة؟"},
        {id: 97, cat: 'misc', fr: "Où dois-je m’inscrire ?", ar: "أين يجب أن أسجّل؟"},
        {id: 98, cat: 'misc', fr: "Où peut-on suivre un cours en ligne ?", ar: "أين يمكن متابعة دورة عبر الإنترنت؟"},

    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let currentCat = 'all';
    let searchTerm = '';

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function render() {
        grid.innerHTML = '';
        const filtered = questions.filter(q => {
            const matchesCat = currentCat === 'all' || q.cat === currentCat;
            const matchesSearch = q.fr.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  q.ar.includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        filtered.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="num">#${q.id}</span>
                    <button class="audio-btn" onclick="speak('${q.fr.replace(/'/g, "\\'")}')" title="استمع لنطق السؤال">🔊</button>
                </div>
                <div class="french">${q.fr}</div>
                <div class="arabic">${q.ar}</div>
            `;
            grid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        render();
    });

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            render();
        });
    });

    render();
</script>
</body>
</html>
