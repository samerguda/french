    let currentCat = 'all';
    let searchTerm = '';
    let currentFlashIndex = 0;
    let currentQuizItem = null;

    function speak(text, lang) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }
    }

    function switchView(mode, btn) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.getElementById('gridControls').style.display = mode === 'grid' ? 'flex' : 'none';
        document.getElementById('grid').style.display = mode === 'grid' ? 'grid' : 'none';
        document.getElementById('flashcardView').style.display = mode === 'flashcard' ? 'flex' : 'none';
        document.getElementById('quizView').style.display = mode === 'quiz' ? 'block' : 'none';

        if(mode === 'flashcard') updateFlashcard();
        if(mode === 'quiz') nextQuiz();
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = cat;
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const filtered = data.filter(q => {
            const matchesCat = currentCat === 'all' || q.cat === currentCat;
            const matchesSearch = q.fr.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  q.nl.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  q.ar.includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        filtered.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="num">#${q.id}</span>
                    <div class="audio-group">
                        <button class="audio-btn" onclick="speak('${q.fr.replace(/'/g, "\\'")}', 'fr-FR')" title="نطق فرنسي">🇫🇷 🔊</button>
                        <button class="audio-btn" onclick="speak('${q.nl.replace(/'/g, "\\'")}', 'nl-BE')" title="نطق هولندي بلجيكي">🇧🇪 🔊</button>
                    </div>
                </div>
                <div class="lang-block">
                    <div class="french">${q.fr}</div>
                </div>
                <div class="lang-block">
                    <div class="dutch">${q.nl}</div>
                </div>
                <div class="arabic">${q.ar}</div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderGrid();
    });

    // Flashcard Logic
    function updateFlashcard() {
        const cardElem = document.getElementById('card');
        cardElem.classList.remove('flipped');
        const q = data[currentFlashIndex];
        document.getElementById('flashFr').innerText = q.fr;
        document.getElementById('flashNl').innerText = q.nl;
        document.getElementById('flashAr').innerText = q.ar;
        document.getElementById('cardCounter').innerText = `${currentFlashIndex + 1} / ${data.length}`;
    }

    function nextCard() {
        currentFlashIndex = (currentFlashIndex + 1) % data.length;
        updateFlashcard();
    }

    function prevCard() {
        currentFlashIndex = (currentFlashIndex - 1 + data.length) % data.length;
        updateFlashcard();
    }

    // Quiz Logic
    function nextQuiz() {
        const randomIndex = Math.floor(Math.random() * data.length);
        currentQuizItem = data[randomIndex];

        document.getElementById('quizFr').innerText = currentQuizItem.fr;
        document.getElementById('quizAr').innerText = currentQuizItem.ar;

        let options = [currentQuizItem.nl];
        while(options.length < 3) {
            let opt = data[Math.floor(Math.random() * data.length)].nl;
            if(!options.includes(opt)) options.push(opt);
        }
        options.sort(() => Math.random() - 0.5);

        const optionsElem = document.getElementById('quizOptions');
        optionsElem.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === currentQuizItem.nl) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('wrong');
                }
            };
            optionsElem.appendChild(btn);
        });
    }

    renderGrid();
</script>
