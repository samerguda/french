<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 جملة بالفرنسية — Je serai (سأكون)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .grammar-card {
            background: #eff6ff;
            border-right: 4px solid var(--primary);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .grammar-card h3 {
            color: var(--primary-hover);
            margin-bottom: 10px;
        }

        .conjugation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
            font-family: 'Poppins', sans-serif;
            direction: ltr;
        }

        .conj-item {
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #f1f5f9;
            color: var(--text-sub);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .num {
            background: #dbeafe;
            color: var(--primary);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .french {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            direction: ltr;
            text-align: left;
            margin-bottom: 6px;
        }

        .arabic {
            color: var(--text-sub);
            font-size: 1rem;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="grammar-card">

        <div class="conjugation-grid">

            <div class="conj-item">Tu seras (ستكون)</div>
            <div class="conj-item">Il / Elle sera (سيكون / ستكون)</div>
            <div class="conj-item">Nous serons (سنكون)</div>
            <div class="conj-item">Vous serez (ستكونون / حضرتك ستكون)</div>
            <div class="conj-item">Ils / Elles seront (سيكونون / سيكونّ)</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن جملة بالفرنسية أو العربية...">
        </div>
        <div class="tabs" id="categoryTabs">
            <button class="tab-btn active" data-cat="all">الكل (100)</button>
            <button class="tab-btn" data-cat="daily">الحياة اليومية</button>
            <button class="tab-btn" data-cat="feelings">المشاعر والحالة</button>

            <button class="tab-btn" data-cat="future">المستقبل والخطط</button>
            <button class="tab-btn" data-cat="misc">مواقف متنوعة</button>
        </div>
    </div>

    <div class="grid" id="grid"></div>
</div>

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let currentCat = 'all';
    let searchTerm = '';

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function render() {
        grid.innerHTML = '';
        const filtered = sentences.filter(s => {
            const matchesCat = currentCat === 'all' || s.cat === currentCat;
            const matchesSearch = s.fr.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  s.ar.includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        filtered.forEach(s => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="num">#${s.id}</span>
                    <button class="audio-btn" onclick="speak('${s.fr.replace(/'/g, "\\'")}')" title="استمع لنطق الجملة">🔊</button>
                </div>
                <div class="french">${s.fr}</div>
                <div class="arabic">${s.ar}</div>
            `;
            grid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        render();
    });

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            render();
        });
    });

    render();
</script>
</body>
</html>
