            padding: 0;

            line-height: 1.6;
            padding: 20px;

        .container {

            margin: 0 auto;
        }

            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #f1f5f9;
            color: var(--text-sub);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .num {
            background: #e0e7ff;
            color: var(--primary);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .french {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            direction: ltr;
            text-align: left;
            margin-bottom: 6px;

        .arabic {

    let currentCat = 'all';
    let searchTerm = '';

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            window.speechSynthesis.speak(utterance);
        }
    }

    function render() {
        grid.innerHTML = '';
        const filtered = questions.filter(q => {
            const matchesCat = currentCat === 'all' || q.cat === currentCat;
            const matchesSearch = q.fr.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  q.ar.includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        filtered.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="num">#${q.id}</span>
                    <button class="audio-btn" onclick="speak('${q.fr.replace(/'/g, "\\'")}')" title="استمع لنطق السؤال">🔊</button>

                <div class="french">${q.fr}</div>
                <div class="arabic">${q.ar}</div>
            `;
            grid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        render();
    });

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            render();
        });
    });

    render();
